<header class="h-20 bg-white border-b-2 border-slate-100 flex items-center justify-between px-4 lg:px-8 z-10 shadow-sm">
  <div class="flex items-center gap-4 w-full">
    <!-- Mobile Menu Button -->
    <button onclick="toggleSidebar()" class="lg:hidden p-2.5 -ml-2 text-slate-600 hover:bg-gradient-to-r hover:from-civil-light hover:to-red-50 hover:text-civil-red rounded-xl transition-all duration-200">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>

    <!-- Logo for Mobile -->
    <div class="lg:hidden flex items-center gap-2">
      <div class="w-8 h-8 bg-gradient-to-br from-civil-red to-civil-dark rounded-lg flex items-center justify-center shadow-md">
        <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
      </div>
    </div>

    <!-- Page Title -->
    <div class="mobile-title-container flex-1 lg:hidden">
      <h2 class="text-base font-bold text-slate-800" id="mobileTitle">Kasa Asistanım</h2>
      <p class="text-xs text-slate-500">Civil Mall of İstanbul</p>
    </div>

    <!-- Desktop Title & Info -->
    <div class="hidden lg:flex items-center gap-4 flex-1">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-civil-red to-civil-dark rounded-xl flex items-center justify-center shadow-md">
          <i data-lucide="shopping-bag" class="w-6 h-6 text-white"></i>
        </div>
        <div>
          <h2 id="pageTitle" class="text-xl font-bold text-slate-800">Kasa Asistanım</h2>
          <p class="text-xs text-slate-500">Gelişmiş Kasa Yönetim Sistemi</p>
        </div>
      </div>
    </div>

    <!-- Right Side Actions -->
    <div class="flex items-center gap-2">
      <!-- Time Display -->
      <div class="hidden md:flex items-center gap-2 px-3 py-2 bg-gradient-to-r from-slate-50 to-slate-100 rounded-lg border border-slate-200">
        <i data-lucide="clock" class="w-4 h-4 text-civil-red"></i>
        <span class="text-sm font-medium text-slate-700" id="headerTime">--:--</span>
      </div>

      <!-- Help Button -->
      <button onclick="openChat()" class="hidden sm:flex items-center gap-2 px-3 py-2 bg-gradient-to-r from-civil-red to-civil-dark text-white rounded-lg hover:shadow-lg transition-all duration-200 text-sm font-medium">
        <i data-lucide="help-circle" class="w-4 h-4"></i>
        <span class="hidden lg:inline">Yardım</span>
      </button>
    </div>
  </div>
</header>

<script>
  // Real-time clock update
  function updateHeaderTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const timeElement = document.getElementById('headerTime');
    if (timeElement) {
      timeElement.textContent = `${hours}:${minutes}`;
    }
  }

  // Update time every second
  setInterval(updateHeaderTime, 1000);
  updateHeaderTime();
</script>
