<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Civil Kasa Asistanı</title>
  <link rel="icon" href="https://images.seeklogo.com/logo-png/32/2/civil-logo-png_seeklogo-326678.png" type="image/png">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            civil: {
              red: '#dd3612',
              dark: '#c22f0f',
              light: '#fff1f0',
              bg: '#f8fafc'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Icons (Lucide) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .content-card { box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .step-number { background-color: #dd3612; color: #fff; border-radius: 9999px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
    .step-image { width: 100%; max-width: 640px; border-radius: 10px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: opacity 0.2s ease; }
    .step-image:hover { opacity: 0.9; }
    .chat-widget { box-shadow: 0 12px 32px rgba(0,0,0,0.25); }
    @media (min-width: 1024px) { .quick-grid { grid-template-columns: repeat(3, minmax(200px, 1fr)); } }
    @media (max-width: 1023px) { .quick-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const navItems = [
      { id: 'dashboard', title: 'Ana Sayfa', icon: 'layout-grid' },
      { id: 'raporlar', title: 'Kasa Raporları', icon: 'bar-chart-2' },
      { id: 'pos-islemleri', title: 'POS İşlemleri', icon: 'credit-card' },
      { id: 'ozel-odemeler', title: 'Chippin & Hediye Kartları', icon: 'gift' },
      { id: 'nakit-yatirma', title: 'Nakit Yatırma', icon: 'wallet-2' },
      { id: 'kasa-duzeltme', title: 'İşlem Kayması', icon: 'alert-triangle' },
      { id: 'masraf-duzeltme', title: 'Masraf Girişi', icon: 'coins' },
      { id: 'sablon', title: 'Şablon', icon: 'file-spreadsheet' },
      { id: 'fatura-portal', title: 'E-Fatura & Portal', icon: 'file-text' },
      { id: 'havale-eft', title: 'Havale / EFT', icon: 'refresh-ccw' },
      { id: 'taksitler', title: 'Taksitler', icon: 'percent' },
    ];

    const quickLinks = [
      'raporlar','pos-islemleri','nakit-yatirma','kasa-duzeltme','masraf-duzeltme','ozel-odemeler','sablon','fatura-portal','havale-eft','taksitler'
    ];

    const policyHighlights = [
      {
        title: 'QR Ödeme Banka Seçimi',
        color: 'amber',
        details: [
          'Müşteri hangi banka hesabından QR ile ödeme yapacaksa POS\'ta o bankayı seçin.',
          'Anlaşmamız olmayan bankalarda öncelikli olarak Yapı Kredi seçilerek QR ödeme alınmalıdır.'
        ]
      },
      {
        title: 'POS İade Limiti Aşıldı Uyarısı',
        color: 'rose',
        details: [
          'Mağazadan limit aşımı işlemi yapılmaz, iade merkez muhasebe tarafından yapılır.',
          'Fatura, slip, uzun barkod ve iade tutarı ile birlikte ztomruk@civil.com.tr, akurt@civil.com.tr, ksezgin@civil.com.tr adreslerine mail gönderin.',
          'Mağaza ürünleri sistemden iade almamalıdır; merkez talimat oluşturduktan sonra ürünler envantere eklenir.',
          'İade süresi banka ve müşteri anlaşmasına bağlıdır, kesin gün verilmez.'
        ]
      },
      {
        title: 'Kısmi / Çapraz İadeler',
        color: 'indigo',
        details: [
          'Tüm bankalarda kısmi iade mümkündür.',
          'Mağaza çapraz iade yapamıyorsa POS terminal no ve üye işyeri no bilgilerini aynı muhasebe adreslerine iletin.'
        ]
      },
      {
        title: 'Ödeme Araçları Mutabakatı',
        color: 'emerald',
        details: [
          'Edenred, Setcard ve iWallet tutarlarını portal ile sistem arasında her akşam karşılaştırın.',
          'Hatalı kayıt varsa "Hatalı Girilmiş Ödeme Kayıtlarını Yeniden Düzenle" raporundan düzeltin.'
        ]
      },
      {
        title: 'Nakit Çıkışı Fiş Tipi',
        color: 'cyan',
        details: ['Nakit çıkışı yapılırken fiş tipi mutlaka "Tediyeden" seçilmeli, tahsil olmamalı.']
      },
      {
        title: 'Hatalı İşlemler Kuralı',
        color: 'slate',
        details: ['Karşılığı olan işlemler düzeltilebilir, karşılığı olmayan işlemler düzeltilmez.']
      }
    ];

    const SectionContainer = ({ id, activeSection, children }) => (
      <section className={`${activeSection === id ? 'block' : 'hidden'} fade-in`}>{children}</section>
    );

    const StepCard = ({ number, title, children }) => (
      <div className="content-card bg-white rounded-xl p-5 space-y-3">
        {title && (
          <div className="flex items-center gap-3 mb-1">
            {number && <div className="step-number text-sm">{number}</div>}
            <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
          </div>
        )}
        <div className="space-y-3 text-slate-700 text-sm leading-relaxed">{children}</div>
      </div>
    );

    const Image = ({ src, alt }) => (
      <img src={src} alt={alt} className="step-image" onClick={() => openModal(src)} />
    );

    const PaymentFlow = ({ title, color, steps }) => (
      <div className="content-card bg-white rounded-xl p-5 space-y-4">
        <h3 className={`text-xl font-bold flex items-center gap-2 text-${color}-700`}>
          <i data-lucide="credit-card" className="w-6 h-6"></i> {title}
        </h3>
        <div className="grid md:grid-cols-2 gap-4 text-sm text-slate-700">
          {steps.map((step, idx) => (
            <div key={idx} className="space-y-3">
              <p className="font-semibold">{step.title}</p>
              {step.image && <Image src={step.image} alt={step.title} />}
            </div>
          ))}
        </div>
      </div>
    );

    const SearchBar = ({ value, onChange }) => (
      <div className="mb-6">
        <div className="flex items-center bg-white rounded-xl border border-slate-200 px-4 py-2 shadow-sm">
          <i data-lucide="search" className="w-5 h-5 text-slate-500"></i>
          <input
            type="text"
            placeholder="Başlık veya anahtar kelime ara..."
            className="ml-2 w-full focus:outline-none text-sm py-2"
            value={value}
            onChange={(e) => onChange(e.target.value)}
          />
        </div>
      </div>
    );

    const Modal = () => (
      <div id="imageModal" className="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4" onClick={closeModal}>
        <img id="modalImage" src="" className="max-w-full max-h-[90vh] rounded-lg shadow-2xl transform transition-transform scale-95" />
        <button className="absolute top-5 right-5 text-white p-2 hover:bg-white/20 rounded-full transition-colors">
          <i data-lucide="x" className="w-8 h-8"></i>
        </button>
      </div>
    );

    const ChatWidget = ({ open, onClose, onOpen }) => (
      <>
        <button onClick={onOpen} id="floatingChatButton" className={`fixed bottom-4 right-4 bg-civil-red text-white p-4 rounded-full shadow-xl z-50 flex items-center justify-center lg:hidden ${open ? 'hidden' : ''}`}>
          <i data-lucide="bot" className="w-6 h-6"></i>
        </button>
        <div className={`fixed bottom-4 right-4 w-full max-w-sm bg-white rounded-2xl border border-slate-200 transform transition-transform z-40 flex flex-col chat-widget ${open ? 'translate-y-0' : 'translate-y-[120%]'}`} style={{maxHeight: '620px', height: '70vh'}}>
          <div className="bg-civil-red text-white p-4 rounded-t-2xl flex justify-between items-center cursor-pointer" onClick={onClose}>
            <div className="flex items-center gap-2">
              <i data-lucide="bot" className="w-5 h-5"></i>
              <span className="font-bold">Akıllı Asistan</span>
            </div>
            <i data-lucide="chevron-down" className="w-5 h-5"></i>
          </div>
          <div className="p-4 border-b border-slate-100">
            <h4 className="font-bold text-slate-800">Nasıl yardımcı olabilirim?</h4>
            <p className="text-sm text-slate-600">Setcard, nakit yatırma, taksit, iade gibi anahtar kelimelerle menüye yönlenebilirsiniz.</p>
          </div>
          <div className="p-4 space-y-2 overflow-y-auto text-sm bg-slate-50 flex-1">
            <div className="bg-white p-3 rounded-lg border border-slate-100 shadow-sm text-slate-700">Anahtar kelime yazın; ilgili sayfa otomatik açılır.</div>
          </div>
          <div className="p-3 border-t border-slate-100">
            <form onSubmit={(e)=>{e.preventDefault();}} className="flex gap-2">
              <input disabled className="flex-1 bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-sm" placeholder="Kullanım hazır" />
              <button type="button" className="bg-slate-200 text-slate-500 px-3 py-2 rounded-lg text-sm" onClick={onClose}>Kapat</button>
            </form>
          </div>
        </div>
      </>
    );

    function openModal(src) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImage');
      img.src = src;
      modal.classList.remove('hidden');
      setTimeout(()=> img.classList.remove('scale-95'), 10);
    }
    function closeModal() {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImage');
      img.classList.add('scale-95');
      setTimeout(()=> modal.classList.add('hidden'), 150);
    }

    const SectionHeading = ({ icon, title, subtitle }) => (
      <div className="flex items-center justify-between mb-6">
        <div className="flex items-center gap-3">
          <i data-lucide={icon} className="text-civil-red"></i>
          <div>
            <h2 className="text-2xl font-bold text-slate-800">{title}</h2>
            {subtitle && <p className="text-sm text-slate-500">{subtitle}</p>}
          </div>
        </div>
      </div>
    );

    const Dashboard = ({ onNavigate }) => (
      <div className="space-y-6">
        <div>
          <h1 className="text-2xl font-bold text-slate-800 mb-2">Hızlı Erişim Menüsü</h1>
          <p className="text-slate-500">İhtiyacınız olan işlemi seçin.</p>
        </div>
        <div className="grid quick-grid gap-4">
          {quickLinks.map((id) => {
            const nav = navItems.find((n) => n.id === id);
            return (
              <button key={id} onClick={() => onNavigate(id)} className="bg-white p-5 rounded-xl shadow-md border border-slate-100 hover:border-civil-red/50 hover:shadow-lg transition-all text-left group">
                <div className="w-10 h-10 rounded-full bg-slate-100 text-civil-red flex items-center justify-center mb-3 group-hover:bg-civil-light transition-colors">
                  <i data-lucide={nav?.icon || 'sparkles'} className="w-5 h-5"></i>
                </div>
                <h3 className="font-semibold text-slate-800">{nav?.title}</h3>
              </button>
            );
          })}
        </div>
        <div className="grid md:grid-cols-2 gap-4">
          {policyHighlights.map((item, idx) => {
            const badgeClass = {
              amber: 'bg-amber-100 text-amber-700',
              rose: 'bg-rose-100 text-rose-700',
              indigo: 'bg-indigo-100 text-indigo-700',
              emerald: 'bg-emerald-100 text-emerald-700',
              cyan: 'bg-cyan-100 text-cyan-700',
              slate: 'bg-slate-100 text-slate-700'
            }[item.color] || 'bg-slate-100 text-slate-700';

            return (
              <div key={idx} className="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
                <div className="flex items-center gap-2 mb-2">
                  <span className={`inline-flex h-8 w-8 rounded-full items-center justify-center font-bold text-sm ${badgeClass}`}>{idx+1}</span>
                  <h3 className="font-semibold text-slate-800">{item.title}</h3>
                </div>
                <ul className="text-sm text-slate-700 space-y-1 list-disc pl-5">
                  {item.details.map((d,i)=>(<li key={i}>{d}</li>))}
                </ul>
              </div>
            );
          })}
        </div>
      </div>
    );

    const PosWarnings = () => (
      <StepCard title="Kritik POS Uyarıları">
        <ul className="list-disc pl-5 space-y-2">
          <li>Müşteri QR ödemede hangi bankayı kullanacaksa POS cihazında o banka seçilmelidir. Anlaşma yoksa önce Yapı Kredi ile QR alın.</li>
          <li>"POS iade limiti aşıldı" uyarısında mağaza limit açtırmaz. Fatura, slip ve uzun barkod bilgileriyle ztomruk@civil.com.tr, akurt@civil.com.tr, ksezgin@civil.com.tr adreslerine mail atın.</li>
          <li>İade süresi bankayla müşteri arasındaki anlaşmaya bağlıdır; kesin gün verilmez.</li>
          <li>Tüm bankalarda kısmi iade yapılabilir. Çapraz iade yapılamıyorsa POS terminal ve üye işyeri numarasını ilgili mail adreslerine gönderin.</li>
        </ul>
      </StepCard>
    );

    const sectionsContent = ({ activeSection, search, onNavigate }) => {
      return (
        <>
          <SectionContainer id="dashboard" activeSection={activeSection}>
            <Dashboard onNavigate={onNavigate} />
          </SectionContainer>

          <SectionContainer id="raporlar" activeSection={activeSection}>
            <SectionHeading icon="bar-chart-2" title="Kasa Raporları" />
            <StepCard number="1" title="Hareket Özeti Alma">
              <p>Mağaza hareket özeti ekranından <b>Kasa-Kasiyer Raporu</b> seçin; yekünler kasiyer bazında listelenir.</p>
              <Image src="https://i.hizliresim.com/mnf88h7.png" alt="Kasa-Kasiyer Raporu" />
              <p><b>Kasiyer Bazında Listelensin</b> seçimini <b>Evet</b> yaparak kişi bazlı liste alın.</p>
              <Image src="https://i.hizliresim.com/o0hi6mp.png" alt="Kasiyer bazında" />
            </StepCard>
          </SectionContainer>

          <SectionContainer id="pos-islemleri" activeSection={activeSection}>
            <SectionHeading icon="credit-card" title="POS İşlemleri" subtitle="Satış, iade ve raporlama adımları" />
            <div className="space-y-5">
              <StepCard number="1" title="Taksitli Satış">
                <p>Taksitli satışlarda kart POS\'a takılmalı; çip yoksa yan taraftan çekme denenir.</p>
                <Image src="https://i.hizliresim.com/izfkfvm.png" alt="Taksitli satış" />
              </StepCard>
              <StepCard number="2" title="POS'ta QR ile İşlem Alma">
                <p>Tutarı girdikten sonra <b>0</b> tuşuna basıp Yapı Kredi\'yi seçin, QR ekranı açılır.</p>
                <Image src="https://i.hizliresim.com/q6ulr01.png" alt="POS QR" />
              </StepCard>
              <StepCard number="3" title="Sliplerin Kullanımı">
                <Image src="https://i.hizliresim.com/b9ehkip.png" alt="Slip" />
              </StepCard>
              <StepCard number="4" title="İşlem İptali ve İadesi">
                <p>Gün sonu alınmadan aynı günse <b>İptal</b>; gün sonu sonrası <b>İade</b> yapılır.</p>
                <div className="grid md:grid-cols-2 gap-4">
                  <div>
                    <p className="text-xs font-semibold mb-1">İptal Ekranı</p>
                    <Image src="https://i.hizliresim.com/c87t4mo.png" alt="İptal" />
                  </div>
                  <div>
                    <p className="text-xs font-semibold mb-1">İade Ekranı</p>
                    <Image src="https://i.hizliresim.com/38lrif4.png" alt="İade" />
                  </div>
                </div>
              </StepCard>
              <StepCard number="5" title="Gün Sonu Alma ve Ek Nüsha">
                <p>Gün sonlarında kontrol için <b>detay rapor</b> seçin. Slip çıkmazsa ek nüsha alın.</p>
                <Image src="https://i.hizliresim.com/eu6nsil.png" alt="Detay rapor" />
                <Image src="https://i.hizliresim.com/hirbfbh.png" alt="Ek nüsha" />
              </StepCard>
              <StepCard number="6" title="Ara Rapor Alma">
                <ul className="list-disc ml-5 space-y-2">
                  <li><b>Yapı Kredi:</b> <b>#</b> → YKB Ana > Liste İşlemleri > Toplamlar</li>
                  <li><b>QNB, Ziraat, Halkbank:</b> <b>*</b> → Ara Rapor</li>
                </ul>
              </StepCard>
              <PosWarnings />
            </div>
          </SectionContainer>

          <SectionContainer id="ozel-odemeler" activeSection={activeSection}>
            <SectionHeading icon="gift" title="Chippin & Hediye Kartları" subtitle="Tüm alternatif ödeme adımları" />
            <div className="space-y-6">
              <PaymentFlow
                title="Chippin ile Ödeme"
                color="blue"
                steps={[
                  { title: '1. Mobile Pay\'i seçin', image: 'https://i.hizliresim.com/tgpzdlu.jpg' },
                  { title: '2. Kasada Chippin seçin', image: 'https://i.hizliresim.com/nzbgwjx.jpg' },
                  { title: '3. Ödemeyi uygulamaya gönderin', image: 'https://i.hizliresim.com/cn4xn4c.jpg' },
                  { title: '4. Müşteri bilgilerini kontrol edin', image: 'https://i.hizliresim.com/rqjv4cy.jpg' },
                  { title: '5. Müşteri onayı', image: 'https://i.hizliresim.com/85fgb54.jpg' },
                  { title: '6. İşlem tamam', image: 'https://i.hizliresim.com/mcmfgsz.jpg' },
                ]}
              />
              <PaymentFlow
                title="iWallet ile Ödeme"
                color="green"
                steps={[
                  { title: '1. Başlangıç Ekranı', image: 'https://i.hizliresim.com/ahvb0na.jpg' },
                  { title: '2. Kasada iWallet Seçimi', image: 'https://i.hizliresim.com/fnjkgpo.jpg' },
                  { title: '3. iWallet Giriş', image: 'https://i.hizliresim.com/bl7t28d.jpg' },
                  { title: '4. Satış İşlemini Başlatma', image: 'https://i.hizliresim.com/1jpga57.jpg' },
                  { title: '5. Kart Bilgilerini Alma ve Onay', image: 'https://i.hizliresim.com/e9zf814.jpg' },
                  { title: '6. Doğrulama', image: 'https://i.hizliresim.com/cnrof3m.jpg' },
                  { title: '7. Başarılı İşlem', image: 'https://i.hizliresim.com/91jrum4.jpg' },
                  { title: '8. İşlemi Bitirme', image: 'https://i.hizliresim.com/5ukfbj4.jpg' },
                ]}
              />
              <PaymentFlow
                title="Setcard ile Ödeme"
                color="orange"
                steps={[
                  { title: '1. Başlangıç Ekranı', image: 'https://i.hizliresim.com/7i6ev8n.jpg' },
                  { title: '2. Kasada Setcard Seçme', image: 'https://i.hizliresim.com/2mlz5mo.jpg' },
                  { title: '3. Setcard Giriş', image: 'https://i.hizliresim.com/tbne02l.jpg' },
                  { title: '4. Müşteri Bilgileri', image: 'https://i.hizliresim.com/jgc5vyp.jpg' },
                  { title: '5. Uygulama Onayı', image: 'https://i.hizliresim.com/lpxzj6v.jpg' },
                  { title: '6. Telefon No Doğrulama', image: 'https://i.hizliresim.com/ciyowa4.jpg' },
                  { title: '7. SMS Doğrulama', image: 'https://i.hizliresim.com/4lmtdqm.jpg' },
                  { title: '8. Başarılı İşlem', image: 'https://i.hizliresim.com/8bzyd2k.jpg' },
                ]}
              />
              <PaymentFlow
                title="Edenred ile Ödeme"
                color="purple"
                steps={[
                  { title: '1. Başlangıç Ekranı', image: 'https://i.hizliresim.com/is4janf.jpg' },
                  { title: '2. Kasada Ederned Seçme', image: 'https://i.hizliresim.com/ny1vhyj.jpg' },
                  { title: '3. Satış Oluşturma', image: 'https://i.hizliresim.com/bawc1b6.jpg' },
                  { title: '4. SMS Doğrulama', image: 'https://i.hizliresim.com/dy5qpst.jpg' },
                  { title: '5. Doğrulama', image: 'https://i.hizliresim.com/nsrgb5e.jpg' },
                  { title: '6. Başarılı İşlem', image: 'https://i.hizliresim.com/goy0aer.jpg' },
                  { title: '7. Ödeme Tamamlama', image: 'https://i.hizliresim.com/awpxe3u.jpg' },
                ]}
              />
            </div>
          </SectionContainer>

          <SectionContainer id="nakit-yatirma" activeSection={activeSection}>
            <SectionHeading icon="wallet-2" title="Nakit Yatırma" />
            <StepCard>
              <p>Hareket özetini kontrol ettikten sonra <b>Kasa Hareketleri</b> ekranını açın, <b>Nakit Hesap Kodu</b> kısmından kendi şubenizi seçin.</p>
              <Image src="https://i.hizliresim.com/hase4r9.png" alt="Kasa Hareketleri" />
              <p><b>Cari Hesap Kodu</b> aramasına "Muhtelif" yazıp tedarikçiyi seçin.</p>

    const App = () => {
      const [activeSection, setActiveSection] = useState('dashboard');
      const [search, setSearch] = useState('');
      const [chatOpen, setChatOpen] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      useEffect(() => { if (window.lucide) lucide.createIcons(); }, [activeSection, chatOpen, sidebarOpen, search]);
      useEffect(() => { showSectionAfterNavigate(search); }, [search]);

      const handleNavigate = (id) => {
        setActiveSection(id);
        setSidebarOpen(false);
        if (window.innerWidth < 1024) window.scrollTo({top:0,behavior:'smooth'});
      };

      const showSectionAfterNavigate = (value) => {
        if (value.length > 1) {
          const keywordMap = {
            'setcard':'ozel-odemeler', 'hediye kart':'ozel-odemeler', 'chippin':'ozel-odemeler', 'iwallet':'ozel-odemeler', 'ederned':'ozel-odemeler',
            'taksit':'taksitler', 'vade':'taksitler', 'kasa kapanış':'nakit-yatirma', 'nakit':'nakit-yatirma', 'kayma':'kasa-duzeltme', 'masraf':'masraf-duzeltme', 'fiyat':'masraf-duzeltme',
            'fatura':'fatura-portal', 'portal':'fatura-portal', 'iade':'pos-islemleri', 'iptal':'pos-islemleri', 'pos':'pos-islemleri', 'rapor':'raporlar', 'havale':'havale-eft'
          };
          for (const [k,v] of Object.entries(keywordMap)) {
            if (value.toLowerCase().includes(k)) {
              setActiveSection(v);
              break;
            }
          }
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">
          <aside className={`bg-white w-72 fixed inset-y-0 left-0 z-30 transform ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} lg:translate-x-0 lg:static border-r border-slate-200 flex flex-col shadow-2xl lg:shadow-none transition-transform`}>
            <div className="h-16 flex items-center px-6 border-b border-slate-100 bg-civil-red text-white">
              <div className="flex items-center gap-3">
                <i data-lucide="shopping-bag" className="w-6 h-6"></i>
                <span className="font-bold text-xl">Kasa Asistanı</span>
              </div>
              <button className="lg:hidden ml-auto" onClick={()=>setSidebarOpen(false)}><i data-lucide="x" className="w-6 h-6"></i></button>
            </div>

              <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2">Menü</div>

              <button onClick={()=>setChatOpen(true)} className="w-full bg-civil-red text-white py-2.5 px-4 rounded-lg font-medium text-sm shadow-md shadow-red-200 hover:bg-civil-dark transition-colors flex items-center justify-center gap-2">
                <i data-lucide="bot" className="w-4 h-4"></i> Asistan
              </button>
              <div className="text-xs text-center text-slate-400 mt-3">v3.0 • React PWA</div>
            </div>
          </aside>

          <main className="flex-1 flex flex-col h-screen overflow-hidden bg-civil-bg">
            <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8">
              <div className="flex items-center gap-3 w-full">
                <button onClick={()=>setSidebarOpen(!sidebarOpen)} className="lg:hidden p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-lg">

                </button>

                  <h2 className="text-lg font-semibold text-slate-800 lg:hidden text-right">{navItems.find(n=>n.id===activeSection)?.title || 'Kasa Yardımcım'}</h2>
                </div>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-4 lg:p-8 space-y-6">
              <SearchBar value={search} onChange={setSearch} />
              {sectionsContent({activeSection, search, onNavigate: handleNavigate})}
              <div className="h-10"></div>
            </div>
          </main>
          <ChatWidget open={chatOpen} onOpen={()=>setChatOpen(true)} onClose={()=>setChatOpen(false)} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  <Modal />

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').then(() => console.log('Service Worker aktif.')).catch((err)=>console.log('SW hatası', err));

  </script>
