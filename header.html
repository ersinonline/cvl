<header class="app-header h-16 border-b flex items-center justify-between px-4 lg:px-8 z-10">
  <div class="flex items-center gap-2 w-full">
    <button onclick="toggleSidebar()" class="header-icon-btn lg:hidden -ml-1" aria-label="Menüyü aç">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
    <button
      id="mobileSearchButton"
      type="button"
      onclick="openCommandPalette()"
      class="header-icon-btn lg:hidden"
      aria-label="Hızlı arama"
    >
      <i data-lucide="search" class="w-5 h-5"></i>
    </button>
    <div class="mobile-title-container flex-1 text-right lg:hidden">
      <h2 class="text-lg font-semibold" id="mobileTitle">Kasa Asistanım</h2>
    </div>
    <div class="hidden lg:flex items-center gap-3 ml-auto">
      <button
        id="headerSearchButton"
        type="button"
        onclick="openCommandPalette()"
        class="header-search-btn"
        aria-label="Komut paletini aç"
      >
        <i data-lucide="search" class="w-4 h-4"></i>
        <span class="flex-1 text-left">İşlem, konu veya kural ara...</span>
        <span class="kbd-chip">Ctrl K</span>
      </button>
      <span id="connectivityPill" class="connectivity-pill is-online" title="Bağlantı durumu">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        Çevrimiçi
      </span>
      <button
        id="themeToggleButton"
        type="button"
        class="header-icon-btn theme-toggle-btn"
        onclick="cycleTheme()"
        aria-label="Temayı değiştir"
        title="Tema"
      >
        <i data-lucide="monitor" class="w-5 h-5"></i>
      </button>
      <button
        id="shortcutsHelpButton"
        type="button"
        class="header-icon-btn"
        onclick="toggleShortcutsHelp()"
        aria-label="Kısayolları göster"
        title="Kısayollar"
      >
        <i data-lucide="keyboard" class="w-5 h-5"></i>
      </button>
      <h2 id="pageTitle" class="text-right text-lg font-semibold">Kasa Asistanım</h2>
    </div>
    <div class="flex lg:hidden items-center gap-1 ml-2">
      <button
        type="button"
        class="header-icon-btn theme-toggle-btn"
        onclick="cycleTheme()"
        aria-label="Temayı değiştir"
      >
        <i data-lucide="monitor" class="w-5 h-5"></i>
      </button>
    </div>
  </div>
</header>
