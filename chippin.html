<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Chippin ile Ödeme • Civil Kasa Asistanı</title>
    <link rel="icon" href="https://images.seeklogo.com/logo-png/32/2/civil-logo-png_seeklogo-326678.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
    <button onclick="openChat()" id="floatingChatButton" class="fixed bottom-4 right-4 bg-civil-red text-white p-4 rounded-full shadow-xl z-50 flex items-center justify-center">
        <i data-lucide="bot" class="w-6 h-6"></i>
    </button>

    <div id="mobileOverlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>

    <div id="sidebarMount"></div>
    
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-civil-bg relative">
        <div id="headerMount"></div>
        <div id="contentArea" class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
            <section id="chippin" class="content-section fade-in block">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i data-lucide="star" class="text-civil-red"></i> Chippin ile Ödeme
                </h2>
                <div class="space-y-6 search-container">
                    <div class="guide-card bg-white rounded-xl p-5 search-item">
                        <div class="grid md:grid-cols-2 gap-4">
                            <div class="space-y-3">
                                <p><b class="font-semibold">1. Mobile Pay'i seçin</b></p>
                                <img src="https://i.hizliresim.com/tgpzdlu.jpg" alt="Chippin başlangıç ekranı" class="step-image" onclick="openModal(this.src)">
                                <p><b class="font-semibold">2. Kasada Chippin seçin</b></p>
                                <img src="https://i.hizliresim.com/nzbgwjx.jpg" alt="Kasada Chippin seçimi" class="step-image" onclick="openModal(this.src)"> 
                                <p><b class="font-semibold">3. Ödemeyi uygulamaya gönderin</b></p>
                                <img src="https://i.hizliresim.com/cn4xn4c.jpg" alt="Kampanya ve puan kontrolü" class="step-image" onclick="openModal(this.src)">
                            </div>
                            <div class="space-y-3">
                                <p><b class="font-semibold">4. Müşteri bilgilerini kontrol edin.</b></p>
                                <img src="https://i.hizliresim.com/rqjv4cy.jpg" alt="Ödeme onayı" class="step-image" onclick="openModal(this.src)"> 
                                <p><b class="font-semibold">5. Müşteri onayına gönderin.</b></p>
                                <img src="https://i.hizliresim.com/85fgb54.jpg" alt="QR / OTP doğrulama" class="step-image" onclick="openModal(this.src)"> 
                                <p><b class="font-semibold">6. İşlemin tamamlandı.</b></p>
                                <img src="https://i.hizliresim.com/mcmfgsz.jpg" alt="Başarılı işlem ekranı" class="step-image" onclick="openModal(this.src)">
                            </div>
                        </div>
                    </div>
                </div>
            </section>
            <div class="h-20"></div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
