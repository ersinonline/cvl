<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Civil Kasa Asistanı</title>
    <link rel="icon" href="https://images.seeklogo.com/logo-png/32/2/civil-logo-png_seeklogo-326678.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

    <button 
        onclick="openChat()" 
        id="floatingChatButton"
        class="fixed bottom-4 right-4 bg-civil-red text-white p-4 rounded-full shadow-xl z-50 flex items-center justify-center">
        <i data-lucide="bot" class="w-6 h-6"></i>
    </button>

    <div id="mobileOverlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>
    <div id="sidebarMount"></div>
    <main class="flex-1 flex flex-col h-screen overflow-hidden bg-civil-bg relative">      
        <div id="headerMount"></div>

        <div id="contentArea" class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
            <div class="h-20"></div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
