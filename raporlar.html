<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Kasa Raporları • Civil Kasa Asistanı</title>
  <link rel="icon" href="https://images.seeklogo.com/logo-png/32/2/civil-logo-png_seeklogo-326678.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">
  <button onclick="openChat()" id="floatingChatButton" class="fixed bottom-4 right-4 bg-civil-red text-white p-4 rounded-full shadow-xl z-50 flex items-center justify-center">
    <i data-lucide="bot" class="w-6 h-6"></i>
  </button>
  <div id="mobileOverlay" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden backdrop-blur-sm transition-opacity" onclick="toggleSidebar()"></div>
  <div id="sidebarMount"></div>
    
  <main class="flex-1 flex flex-col h-screen overflow_hidden bg-civil-bg relative">
    <div id="headerMount"></div>
    <div id="contentArea" class="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
      <section id="raporlar" class="content-section fade-in block">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="text-civil-red"></i> Kasa Raporları
        </h2>
        <div class="grid md:grid-cols-2 gap-6 search-container">
          <div class="step-container search-item">
            <div class="step-header">
              <div class="step-number">1</div>
              <h3 class="step-title">Hareket Özeti Alma</h3>
            </div>
            <div class="step-content">
              <p>Mağaza hareket özeti kısmına tıklayarak <b class="font-semibold">'Kasa-Kasiyer Raporu 2 Yeni'</b> kısmını seçiyoruz.</p>
              <img src="https://i.hizliresim.com/7muv8eg.png" alt="Kasa-Kasiyer Raporu Seçimi görseli" class="step-image" onclick="openModal(this.src)">
            </div>
          </div>
          <div class="step-container search-item">
            <div class="step-header">
              <div class="step-number">2</div>
              <h3 class="step-title">Kasiyer Bazında Listeleme</h3>
            </div>
            <div class="step-content">
              <p>Kasiyer Bazında Listelensin kısmını <b class="font-semibold">'Evet'</b>e çevirerek kasiyer bazında listelemiş oluyoruz.</p>
              <img src="https://i.hizliresim.com/o0hi6mp.png" alt="Kasiyer Bazında Listeleme görseli" class="step-image" onclick="openModal(this.src)">
            </div>
          </div>
        </div>
      </section>
      <div class="h-20"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
