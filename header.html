<header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 z-10">
  <div class="flex items-center gap-3 w-full">
    <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-slate-600 hover:bg-slate-100 rounded-lg">
      <i data-lucide="menu" class="w-6 h-6"></i>
    </button>
    <button
      id="mobileSearchButton"
      type="button"
      onclick="openCommandPalette()"
      class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg"
      aria-label="Hızlı arama"
    >
      <i data-lucide="search" class="w-5 h-5"></i>
    </button>
    <div class="mobile-title-container flex-1 text-right lg:hidden">
      <h2 class="text-lg font-semibold text-slate-800" id="mobileTitle">Kasa Asistanım</h2>
    </div>
    <div class="hidden lg:flex items-center gap-3 ml-auto">
      <button
        id="headerSearchButton"
        type="button"
        onclick="openCommandPalette()"
        class="flex items-center gap-3 px-4 py-2 rounded-xl border border-slate-200 text-sm text-slate-500 hover:border-civil-red/40 hover:text-civil-red transition-colors min-w-[260px]"
      >
        <i data-lucide="search" class="w-4 h-4"></i>
        <span class="flex-1 text-left">İşlem, konu veya kural ara...</span>
        <span class="text-xs text-slate-400">Ctrl K</span>
      </button>
      <button
        id="installAppButton"
        type="button"
        onclick="triggerInstallPrompt()"
        class="hidden items-center gap-2 px-3 py-2 rounded-xl bg-civil-light text-civil-red text-sm font-semibold hover:bg-red-100 transition-colors"
      >
        <i data-lucide="smartphone" class="w-4 h-4"></i>
        Uygulamayı Yükle
      </button>
      <h2 id="pageTitle" class="text-right text-xl font-semibold text-slate-800">Kasa Asistanım</h2>
    </div>
  </div>
</header>
